<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src https://*.supabase.co; base-uri 'none'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>组会抽签 · 汇报排班</title>
  <meta name="description" content="在线组会抽签与历史排班" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23173563'/%3E%3Cpath d='M20 18h24v28H20z' fill='%23f3b844'/%3E%3Cpath d='M27 24h10M27 31h10M27 38h6' stroke='%23173563' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="history.css?v=round-share-1" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="组会抽签主页"><span class="brand-mark">🎲</span><span>组会抽签</span></a>
      <div class="top-actions"><button id="refreshBtn" class="text-btn hidden" type="button">刷新</button><button id="shareBtn" class="outline hidden" type="button">分享本场</button></div>
    </header>
    <p id="status" class="shared-status" role="status">正在连接共享服务…</p>
    <p id="setupNote" class="shared-status hidden">请查看<a href="https://github.com/Tyke0318/Random-Dice#部署">部署步骤</a>。</p>

    <section id="homeView" class="home-view hidden">
      <div class="intro">
        <p class="eyebrow">GROUP MEETING</p>
        <h1>组会分享抽签</h1>
        <p class="subtext">查看场次、抽签和排班。</p>
      </div>
      <div>
        <form id="createForm" class="create-card hidden">
          <div class="card-heading"><span class="step-number">01</span><div><p class="eyebrow">开始一场新的抽签</p><h2>新建汇报场次</h2></div></div>
          <label for="sessionName">场次名称</label>
          <input id="sessionName" maxlength="40" placeholder="例如：11 月组会汇报" required />
          <label for="sessionDate">第一周汇报日期</label>
          <input id="sessionDate" type="date" min="2000-01-01" max="2100-12-31" required />
          <button class="primary">创建场次 <span>→</span></button>
        </form>
      </div>
      <div class="how-it-works home-flow">
        <span>分享本场</span><b>·</b><span>填写姓名</span><b>·</b><span>生成排班表</span>
      </div>
    </section>
    <section id="historySection" class="history-section hidden" aria-labelledby="historyTitle">
      <div class="history-head"><div><p class="eyebrow">全部场次</p><h2 id="historyTitle">历次分享排班</h2></div><span id="historyCount" class="history-count"></span></div>
      <div id="emptyHistory" class="history-empty">暂无场次</div>
      <button id="recentRound" class="outline hidden" type="button">打开上次场次</button>
      <div id="historyList" class="history-list"></div>
    </section>

    <section id="drawView" class="draw-view hidden">
      <div class="draw-head">
        <div><button id="backHome" class="text-btn">‹ 返回主页</button><p class="eyebrow">当前场次</p><h1 id="drawTitle"></h1></div>
        <div class="draw-count"><strong id="personCount">0</strong><span>位已抽签</span></div>
      </div>
      <p id="closedNotice" class="person-sub hidden">此排班已删除，以下是原始抽签结果。</p>
      <div id="drawGrid" class="draw-grid">
        <section class="name-panel">
          <form id="drawForm">
            <label for="personName">姓名</label>
            <input id="personName" class="group-select" maxlength="24" placeholder="填写姓名" autocomplete="off" required />
            <button id="rollBtn" class="primary roll" type="submit" disabled>抽签</button>
          </form>
        </section>
        <section class="dice-panel" aria-live="polite">
          <p class="eyebrow">本次结果</p>
          <div id="diceBox" class="dice-box idle"><span id="diceValue">?</span></div>
          <p id="diceCaption">等待抽签</p>
        </section>
      </div>
      <section class="participants">
        <div class="section-title"><div><p class="eyebrow">抽签结果</p><h2>排班进度</h2></div><button id="finishBtn" class="outline" disabled>结束抽签并归档</button></div>
        <button id="editBtn" type="button" class="text-btn">修改场次信息</button>
        <form id="editForm" class="create-card hidden">
          <label for="editName">场次名称</label>
          <input id="editName" maxlength="40" required />
          <label for="editDate">第一周汇报日期</label>
          <input id="editDate" type="date" min="2000-01-01" max="2100-12-31" required />
          <button class="primary">保存修改</button>
        </form>
        <p id="rankNote" class="person-sub hidden">点数小的排前，同点数按抽签先后。</p>
        <p id="progressEmpty" class="person-sub">还没有人抽签</p>
        <ol id="peopleList" class="people-list"></ol>
      </section>
    </section>

    <section id="scheduleView" class="schedule-view hidden">
      <div class="result-hero">
        <p class="eyebrow">抽签完成 · 排班已生成</p>
        <h1 id="scheduleTitle"></h1>
        <p>每周两人，按抽签顺序汇报。</p>
        <div class="result-actions"><button id="csvBtn" class="primary">导出 CSV</button><button id="copyBtn" class="outline">复制排班</button><button id="printBtn" class="outline">打印 / 存为 PDF</button><button id="newBtn" class="text-btn">返回主页</button></div>
      </div>
      <section class="schedule-card">
        <div class="schedule-card-head"><div><p class="eyebrow">分享汇报排班表</p><h2 id="scheduleName"></h2></div><span id="startDateBadge"></span></div>
        <div class="schedule-meta"><span>从 <strong id="startDate"></strong> 起，每周两人分享</span><span id="scheduleCount"></span></div>
        <div id="scheduleRows" class="schedule-rows"></div>
      </section>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="config.js" defer></script>
  <script src="app.js?v=archive-delete-2" defer></script>
</body>
</html>
